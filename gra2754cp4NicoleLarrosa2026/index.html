<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Gardening 101| Nicole Larrosa, 2026</title>
	
	<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	
<style type="text/css">
	
	
body {
    margin: 0;
}
wrapper {
    margin: auto;
    display: block;
    width: 80%;
}
header {
    height: 200px;
    background-color: rgba(254,165,94,1.00);
}
nav {
    background-color: rgba(255,184,185,1.00);
}
nav ul a {
    color: rgba(23,30,138,1.00);
    text-decoration: none;
}
#about {
    height: 600px;
    background-color: rgba(154,11,14,1.00);
}
#gallery {
    height: 600px;
    background-color: rgba(58,194,190,1.00);
}
#contact {
    height: 600px;
    background-color: rgba(254,104,107,1.00);
}
footer {
    height: 200px;
    background-color: rgba(235,173,174,1.00);
}
ul a li {
    padding: 10px;
    list-style-type: none;
}
ul a li:hover {
    background-color: rgba(198,183,183,1.00);
}
nav ul {
    padding: 0;
    margin: 0;
}
	
	.topnav.responsive a{
    display:block;
}
.topnav.responsive a:not(:first-child) {
     display: none;
}
	
	
.topnav .fa-times {
    display: block;
		padding: 10px; 
			color:white;
		
}
.topnav .fa-bars {
    display: none;
}
.topnav.responsive .fa-times {
    display: none;
}
.topnav.responsive .fa-bars {
    display: block;
	padding: 10px;
	color:white;	
}
	
	
	@media (min-width:600px) {
.topnav a:not(:first-child),.topnav.responsive a:not(:first-child) {
    display:inline-block;
     }
.topnav .icon {
     display:none;
     }
}
	
</style>
	
<script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>
	
</head>

<body>
<wrapper>
  <header></header>
  <nav class="topnav" id="myTopnav">
  <a href="javascript:void(0);" class="icon"
     onclick="myFunction()">
  <i class="fa fa-bars"></i><i class="fa fa-times"></i>
    <ul>
      <a href="#about"><li>About</li></a>
      <a href="#gallery"><li>Gallery</li></a>
      <a href="#contact"><li>Contact</li></a>
    </ul>
	</a>
  </nav>
  <div id="about"></div>
  <section id="gallery"></section>
  <section id="contact"></section>
  <footer></footer>
</wrapper>
</body>
</html>
